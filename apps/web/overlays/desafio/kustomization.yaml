apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: web-desafio

replicas:
  - name: web
    count: 2

images:
  - name: nginx
    newTag: 1.27-alpine

configMapGenerator:
  - name: web-pagina
    behavior: replace
    files:
      - index.html

patches:
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
